<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RV – Online Workspace</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a2b;--mu:#6b7191;--ac:#5b5bf0;--ac2:#7c3aed;--bd:#e2e4f0;--rd:#e5484d;--gn:#22a06b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1120;--card:#1a1d33;--tx:#eef0ff;--mu:#9aa0c4;--bd:#2a2e4d}}
:root[data-theme="dark"]{--bg:#0f1120;--card:#1a1d33;--tx:#eef0ff;--mu:#9aa0c4;--bd:#2a2e4d}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,textarea,input{font:inherit;color:inherit}
.logo{font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#lobby{min-height:100%;display:grid;place-items:center;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;width:100%;max-width:460px}
.card h1{margin:0;font-size:44px}.sub{color:var(--mu);margin:4px 0 18px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0}
textarea{height:86px;resize:none;font:12px monospace;word-break:break-all}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
.btn.alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.full{width:100%;margin-top:6px}
.or{text-align:center;color:var(--mu);margin:14px 0;font-size:13px}
#meet{display:none;height:100%;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
header .logo{font-size:22px}header .sp{flex:1}.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.pill.host{color:var(--ac);border-color:var(--ac)}
main{display:flex;min-height:0}
#stage{flex:1;display:grid;gap:10px;padding:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-auto-rows:minmax(160px,1fr);overflow:auto}
.tile{position:relative;background:#0b0d1a;border-radius:14px;overflow:hidden;display:grid;place-items:center;min-height:160px}
.tile video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#0b0d1a}
.tile .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));font-size:26px;font-weight:700;color:#fff}
.tile .nm{position:absolute;left:8px;bottom:8px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;z-index:2}
.tile .hd{position:absolute;right:8px;top:6px;font-size:20px;z-index:2}
.tile .ac{position:absolute;right:8px;bottom:6px;z-index:2;display:flex;gap:4px}
.tile .ac button{border:0;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;background:#000a;color:#fff}
aside{position:fixed;right:12px;bottom:calc(var(--fh,70px) + 12px);width:min(340px,calc(100vw - 24px));height:min(400px,55vh);background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 12px 40px #0006;display:flex;flex-direction:column;min-height:0;z-index:20;transform:translateY(130%);opacity:0;pointer-events:none;transition:transform .22s,opacity .22s}
aside.open{transform:none;opacity:1;pointer-events:auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--mu);opacity:.5;margin:8px auto 2px;flex:none;touch-action:none;cursor:grab}
.tabs{touch-action:none}.tabs .xbtn{flex:none;padding:6px 14px;font-size:16px}
.tile .fs{position:absolute;left:8px;top:8px;z-index:3;border:0;border-radius:8px;background:#000a;color:#fff;padding:3px 9px;cursor:pointer;font-size:15px}
.tile:fullscreen{border-radius:0}.tile:fullscreen video{object-fit:contain}.tile:-webkit-full-screen video{object-fit:contain}
.tabs{display:flex;border-bottom:1px solid var(--bd)}.tabs button{flex:1;padding:10px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);cursor:pointer}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.pane{display:none;flex:1;min-height:0;flex-direction:column;padding:12px;gap:8px;overflow:auto}.pane.on{display:flex}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{background:var(--bg);border-radius:10px;padding:6px 10px;max-width:92%}.m b{font-size:12px;color:var(--ac)}.m.sys{color:var(--mu);font-size:12px;background:none;text-align:center;align-self:center}
.row{display:flex;gap:6px}.row input{margin:0}
.person{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.person span{flex:1}
.small{font-size:12px;color:var(--mu)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
footer{display:flex;justify-content:center;gap:10px;padding:10px;border-top:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
.cb{border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:9px 14px;cursor:pointer;font-size:13px}
.cb.off{background:var(--rd);color:#fff;border-color:var(--rd)}.cb.on{background:var(--ac);color:#fff;border-color:var(--ac)}.cb.end{background:var(--rd);color:#fff;border-color:var(--rd)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:10px;display:none;z-index:9;font-size:13px}
@media(max-width:800px){aside{left:8px;right:8px;width:auto;height:min(52vh,380px)}}
</style></head><body>
<div id="toast"></div>
<section id="lobby"><div class="card">
 <h1 class="logo">RV</h1><p class="sub">Peer-to-peer meetings & live chat. No sign-in, no accounts.</p>
 <label class="small">Your name</label><input id="name" placeholder="e.g. Aisha" maxlength="24">
 <button class="btn full" id="create">Start a meeting (I'm the host)</button>
 <div class="or">— or join one —</div>
 <label class="small">6-digit meeting code</label>
 <input id="codeIn" inputmode="numeric" maxlength="6" placeholder="123456" style="letter-spacing:6px;font-size:22px;text-align:center">
 <button class="btn alt full" id="joinCode">Join with code</button>
</div></section>
<section id="meet">
 <header><span class="logo">RV</span><span class="pill" id="role"></span><span class="pill" id="codePill" style="cursor:pointer" title="Click to copy"></span><span class="pill" id="count">1 in room</span><span class="sp"></span><span class="pill" id="clock">00:00</span></header>
 <main>
  <div id="stage"></div>
  <aside id="side">
   <div class="grab" title="Swipe down to close"></div>
   <div class="tabs"><button data-p="chat" class="on">Chat</button><button data-p="ppl">People</button><button class="xbtn" id="closeChat" title="Close">✕</button></div>
   <div class="pane on" id="p-chat"><div id="msgs"></div><div class="row"><input id="chatIn" placeholder="Message everyone…" maxlength="500" autocomplete="off"><button class="btn" id="send">Send</button></div></div>
   <div class="pane" id="p-ppl"><div id="plist"></div>
    <button class="btn alt" id="copyLink">Copy invite link</button>
    <div id="hostCtl" style="display:none"><p class="small">Host controls</p>
     <div class="sw"><span>Allow chat</span><input type="checkbox" id="pChat" checked style="width:auto"></div>
     <div class="sw"><span>Allow screen share</span><input type="checkbox" id="pShare" checked style="width:auto"></div>
     <button class="btn alt full" id="muteAll">Mute everyone</button></div></div>
  </aside>
 </main>
 <footer>
  <button class="cb" id="bMic">🎤 Mute</button><button class="cb" id="bCam">📷 Stop video</button>
  <button class="cb" id="bShare">🖥 Share screen</button><button class="cb" id="bHand">✋ Raise hand</button>
  <button class="cb" id="bChat">💬 Chat</button><button class="cb" id="bFull">⛶ Full screen</button><button class="cb end" id="bEnd">Leave</button>
 </footer>
</section>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]};
let me={name:'',host:false},local=null,camTrack=null,peer=null,gconn=null,hostId='',code='',conns={},calls={},names={},perm={chat:true,share:true},hand=false,sharing=false,dummy=null,t0=0;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2800)};
async function media(){try{return await navigator.mediaDevices.getUserMedia({audio:true,video:true})}catch(e){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch(e2){toast('Camera/mic unavailable – joining as viewer');return null}}}
function dum(){if(dummy)return dummy;const c=document.createElement('canvas');c.width=c.height=16;const v=c.captureStream(1).getVideoTracks()[0];v.enabled=false;const ac=new(window.AudioContext||window.webkitAudioContext)(),d=ac.createMediaStreamDestination();dummy=new MediaStream([v,d.stream.getAudioTracks()[0]]);return dummy}
function out(){const s=new MediaStream(local?local.getTracks():[]);['audio','video'].forEach(k=>{if(!s.getTracks().some(t=>t.kind===k))s.addTrack(dum().getTracks().find(t=>t.kind===k))});return s}
function tile(id,name){let t=document.getElementById('t-'+id);if(!t){t=document.createElement('div');t.className='tile';t.id='t-'+id;
 t.innerHTML='<div class="av"></div><video autoplay playsinline></video><span class="nm"></span><span class="hd"></span><button class="fs" title="Full screen this person">⛶</button>';$('#stage').appendChild(t);t.querySelector('.fs').onclick=e=>{e.stopPropagation();fsTile(t)}}
 t.querySelector('.av').textContent=(name[0]||'?').toUpperCase();t.querySelector('.nm').textContent=name+(id==='me'?' (You)':'');return t}
function setStream(id,name,ms){const v=tile(id,name).querySelector('video');v.srcObject=ms;if(id==='me')v.muted=true;v.play&&v.play().catch(()=>{})}
const rmTile=id=>{document.getElementById('t-'+id)?.remove();delete calls[id]};
const mark=(id,on)=>{const t=document.getElementById('t-'+id);t&&(t.querySelector('.hd').textContent=on?'✋':'')};
let unread=0,acks={};
const clearUnread=()=>{unread=0;$('#bChat').textContent='💬 Chat'};
function showTab(p){document.querySelectorAll('.tabs button,.pane').forEach(x=>x.classList.remove('on'));document.querySelector('.tabs [data-p="'+p+'"]').classList.add('on');$('#p-'+p).classList.add('on');if(p==='chat')clearUnread()}
function addMsg(who,text,sys){const d=document.createElement('div');d.className='m'+(sys?' sys':'');if(sys)d.textContent=text;else{const b=document.createElement('b');b.textContent=who+' · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.append(b,document.createElement('br'),document.createTextNode(text))}$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;
 if(!sys&&who!=='You'){const seen=$('#side').classList.contains('open')&&$('#p-chat').classList.contains('on');if(!seen){unread++;$('#bChat').textContent='💬 Chat ('+unread+')'}}return d}
const bc=(m,except)=>Object.entries(conns).forEach(([id,c])=>id!==except&&c.open&&c.send(m));
function refresh(){const list=[{id:'me',name:me.name+(me.host?' (Host)':' (You)')},...Object.entries(names).map(([id,n])=>({id,name:n}))];
 $('#count').textContent=list.length+' in room';const pl=$('#plist');pl.innerHTML='';
 list.forEach(p=>{const d=document.createElement('div');d.className='person';const s=document.createElement('span');s.textContent=p.name;d.appendChild(s);
  if(me.host&&p.id!=='me'){const m=document.createElement('button');m.className='cb';m.textContent='Mute';m.onclick=()=>conns[p.id]&&conns[p.id].send({t:'mute'});
   const k=document.createElement('button');k.className='cb end';k.textContent='Remove';k.onclick=()=>{const c=conns[p.id];if(c){c.send({t:'kick'});setTimeout(()=>c.close(),300)}};d.append(m,k)}pl.appendChild(d)})}
function syncUi(){const a=local&&local.getAudioTracks()[0],v=camTrack;$('#bMic').textContent=(a&&a.enabled)?'🎤 Mute':'🎤 Unmute';$('#bMic').classList.toggle('off',!(a&&a.enabled));
 $('#bCam').textContent=(v&&v.enabled)?'📷 Stop video':'📷 Start video';$('#bCam').classList.toggle('off',!(v&&v.enabled));
 $('#bShare').classList.toggle('on',sharing);$('#bHand').classList.toggle('on',hand);$('#chatIn').disabled=!(me.host||perm.chat);$('#chatIn').placeholder=(me.host||perm.chat)?'Message everyone…':'Chat disabled by host';mark('me',hand)}
function enter(){if($('#meet').style.display==='grid')return;$('#lobby').style.display='none';$('#meet').style.display='grid';$('#role').textContent=me.host?'👑 Host':'Guest';$('#role').classList.toggle('host',me.host);
 $('#hostCtl').style.display=me.host?'block':'none';fh();
 $('#codePill').textContent='Code '+code.slice(0,3)+' '+code.slice(3);$('#codePill').onclick=()=>{navigator.clipboard?.writeText(code);toast('Code copied')};
 t0=Date.now();setInterval(()=>{const s=(Date.now()-t0)/1e3|0;$('#clock').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
 local?setStream('me',me.name,local):tile('me',me.name);syncUi();refresh();addMsg('',me.host?'Meeting started. Share the code '+code+' with people.':'Connected to the host.',1)}
// calls (media, full mesh)
function setup(c,name){calls[c.peer]=c;c.on('stream',s=>setStream(c.peer,names[c.peer]||name,s));c.on('close',()=>rmTile(c.peer))}
const callPeer=(id,name)=>setup(peer.call(id,out(),{metadata:{name:me.name}}),name);
function onCall(c){c.answer(out());setup(c,(c.metadata&&c.metadata.name)||'Guest')}
// HOST
$('#create').onclick=async()=>{const n=$('#name').value.trim();if(!n)return toast('Enter your name');me={name:n,host:true};local=await media();camTrack=local&&local.getVideoTracks()[0];start()};
function start(){peer&&peer.destroy();code=String(100000+Math.floor(Math.random()*900000));hostId='rv-'+code;peer=new Peer(hostId,{config:ICE});
 peer.on('error',e=>e.type==='unavailable-id'?start():toast('Network error: '+e.type));peer.on('open',enter);peer.on('call',onCall);
 peer.on('connection',c=>{c.on('open',()=>{const n=String(c.metadata&&c.metadata.name||'Guest').slice(0,24);
  c.send({t:'hi',perm,list:[{id:hostId,name:me.name+' (Host)'},...Object.entries(names).map(([id,nm])=>({id,name:nm}))]});
  conns[c.peer]=c;names[c.peer]=n;bc({t:'join',id:c.peer,name:n},c.peer);addMsg('',n+' joined',1);toast(n+' joined');refresh()});
  c.on('data',m=>{const n=names[c.peer];if(m.t==='chat'&&perm.chat&&typeof m.text==='string'){const tx=m.text.slice(0,500);addMsg(n,tx);bc({t:'chat',who:n,text:tx},c.peer);c.send({t:'ack',mid:m.mid})}
   else if(m.t==='hand'){mark(c.peer,m.on);m.on&&toast(n+' raised a hand');bc({t:'hand',id:c.peer,on:m.on},c.peer)}});
  c.on('close',()=>{const n=names[c.peer];delete conns[c.peer];delete names[c.peer];rmTile(c.peer);bc({t:'left',id:c.peer});n&&addMsg('',n+' left',1);refresh()})})}
// GUEST
$('#joinCode').onclick=async()=>{const n=$('#name').value.trim(),c=$('#codeIn').value.trim();if(!n)return toast('Enter your name');if(!/^\d{6}$/.test(c))return toast('Enter the 6-digit code');
 $('#joinCode').disabled=true;me={name:n,host:false};local=await media();camTrack=local&&local.getVideoTracks()[0];code=c;hostId='rv-'+c;peer=new Peer({config:ICE});
 peer.on('error',e=>{$('#joinCode').disabled=false;toast(e.type==='peer-unavailable'?'Meeting not found – check the code':'Network error: '+e.type)});peer.on('call',onCall);
 peer.on('open',()=>{gconn=peer.connect(hostId,{metadata:{name:n},reliable:true,serialization:'json'});gconn.on('data',gd);gconn.on('error',e=>toast('Connection error: '+e.type));gconn.on('close',()=>{toast('Disconnected');setTimeout(()=>location.reload(),1500)})})};
function gd(m){if(m.t==='hi'){perm=m.perm;m.list.forEach(p=>names[p.id]=p.name);enter();m.list.forEach(p=>callPeer(p.id,p.name))}
 else if(m.t==='join'){names[m.id]=m.name;addMsg('',m.name+' joined',1);refresh()}
 else if(m.t==='left'){const n=names[m.id];delete names[m.id];rmTile(m.id);n&&addMsg('',n+' left',1);refresh()}
 else if(m.t==='ack'){const f=acks[m.mid];if(f){delete acks[m.mid];f()}}
 else if(m.t==='chat')addMsg(m.who,m.text);else if(m.t==='hand')mark(m.id,m.on);
 else if(m.t==='perm'){perm=m.perm;syncUi();if(!perm.share&&sharing)stopShare()}
 else if(m.t==='mute'){const a=local&&local.getAudioTracks()[0];if(a){a.enabled=false;syncUi();toast('Host muted you')}}
 else if(m.t==='kick'){toast('You were removed by the host');setTimeout(()=>location.reload(),1200)}
 else if(m.t==='end'){toast('Host ended the meeting');setTimeout(()=>location.reload(),1200)}}
// CONTROLS
const vTrack=()=>camTrack||dum().getVideoTracks()[0];
const swapVideo=t=>Object.values(calls).forEach(c=>{const s=c&&c.peerConnection&&c.peerConnection.getSenders().find(x=>x.track&&x.track.kind==='video');s&&s.replaceTrack(t)});
$('#bMic').onclick=()=>{const a=local&&local.getAudioTracks()[0];if(!a)return toast('No microphone');a.enabled=!a.enabled;syncUi()};
$('#bCam').onclick=()=>{if(!camTrack)return toast('No camera');camTrack.enabled=!camTrack.enabled;syncUi()};
function stopShare(){sharing=false;swapVideo(vTrack());local?setStream('me',me.name,local):tile('me',me.name).querySelector('video').srcObject=null;syncUi()}
$('#bShare').onclick=async()=>{if(sharing)return stopShare();if(!me.host&&!perm.share)return toast('Host disabled screen sharing');
 try{const s=await navigator.mediaDevices.getDisplayMedia({video:true}),tr=s.getVideoTracks()[0];swapVideo(tr);sharing=true;setStream('me',me.name,s);tr.onended=stopShare;syncUi()}catch(e){toast('Screen share unavailable')}};
$('#bHand').onclick=()=>{hand=!hand;me.host?bc({t:'hand',id:hostId,on:hand}):gconn&&gconn.send({t:'hand',on:hand});syncUi()};
$('#bEnd').onclick=()=>{if(me.host)bc({t:'end'});setTimeout(()=>location.reload(),200)};
function sendChat(){const v=$('#chatIn').value.trim();if(!v)return;if(!me.host&&!perm.chat)return toast('Chat is disabled by the host');
 if(!me.host&&!(gconn&&gconn.open))return toast('Not connected – message not sent');
 $('#chatIn').value='';const el=addMsg('You',v);
 if(me.host)bc({t:'chat',who:me.name,text:v});
 else{const mid=Math.random().toString(36).slice(2,8),st=document.createElement('span');st.className='small';st.textContent=' …';el.appendChild(st);
  acks[mid]=()=>{st.textContent=' ✓ delivered'};setTimeout(()=>{if(acks[mid]){delete acks[mid];st.textContent=' ⚠ not delivered';st.style.color='var(--rd)'}},5000);
  try{gconn.send({t:'chat',text:v,mid})}catch(e){toast('Send failed')}}
 $('#chatIn').focus()}
$('#send').onclick=sendChat;$('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}});
$('#pChat').onchange=$('#pShare').onchange=()=>{perm={chat:$('#pChat').checked,share:$('#pShare').checked};bc({t:'perm',perm});syncUi()};
$('#muteAll').onclick=()=>{bc({t:'mute'});toast('Everyone muted')};
$('#copyLink').onclick=()=>{navigator.clipboard?.writeText(location.href.split('#')[0]+'#'+code);toast('Invite link copied')};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.p));
const fh=()=>document.documentElement.style.setProperty('--fh',($('footer').offsetHeight||70)+'px');addEventListener('resize',fh);
const closeChat=()=>{$('#side').classList.remove('open');$('#side').style.transform=''};
function openChat(){$('#side').classList.add('open');showTab('chat');$('#chatIn').focus()}
$('#bChat').onclick=()=>{const a=$('#side');a.classList.contains('open')&&$('#p-chat').classList.contains('on')?closeChat():openChat()};
$('#closeChat').onclick=closeChat;
// swipe (touch or mouse) on the handle / tab bar: down or right closes the chat
(()=>{const a=$('#side');let x0=0,y0=0,down=false,drag=false;
 const pd=e=>{if(e.target.closest('.xbtn'))return;down=true;drag=false;x0=e.clientX;y0=e.clientY};
 const pm=e=>{if(!down)return;const dx=e.clientX-x0,dy=e.clientY-y0;if(!drag&&Math.hypot(dx,dy)>8){drag=true;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}a.style.transition='none'}
  if(drag){a.style.transform=dy>0&&dy>=Math.abs(dx)?'translateY('+dy+'px)':dx>0?'translateX('+dx+'px)':''}};
 const pu=e=>{if(!down)return;down=false;a.style.transition='';if(!drag)return;const dx=e.clientX-x0,dy=e.clientY-y0;if((dy>60&&dy>=Math.abs(dx))||(dx>80&&dx>Math.abs(dy)))closeChat();else a.style.transform=''};
 ['.grab','.tabs'].forEach(q=>{const el=a.querySelector(q);el.addEventListener('pointerdown',pd);el.addEventListener('pointermove',pm);el.addEventListener('pointerup',pu);el.addEventListener('pointercancel',pu)});
 a.addEventListener('click',e=>{if(drag){e.stopPropagation();e.preventDefault();drag=false}},true)})();
// FULL SCREEN
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
$('#bFull').onclick=()=>{if(fsEl())return(document.exitFullscreen||document.webkitExitFullscreen).call(document);const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(!f)return toast('Full screen is not supported on this browser');Promise.resolve(f.call(e)).catch(()=>toast('Full screen was blocked'))};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('#bFull').textContent=fsEl()===document.documentElement?'⛶ Exit full screen':'⛶ Full screen';$('#bFull').classList.toggle('on',fsEl()===document.documentElement)}));
function fsTile(t){if(fsEl()===t)return(document.exitFullscreen||document.webkitExitFullscreen).call(document);const f=t.requestFullscreen||t.webkitRequestFullscreen,v=t.querySelector('video');
 if(f)Promise.resolve(f.call(t)).catch(()=>toast('Full screen was blocked'));else if(v&&v.webkitEnterFullscreen)v.webkitEnterFullscreen();else toast('Full screen is not supported on this browser')}
$('#stage').ondblclick=e=>{const t=e.target.closest('.tile');if(t&&t.requestFullscreen)t.requestFullscreen().catch(()=>{})};
if(/^#\d{6}$/.test(location.hash))$('#codeIn').value=location.hash.slice(1);
